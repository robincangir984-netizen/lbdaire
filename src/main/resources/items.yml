# ByCircleGame Eşya ve Ganimet Ayarları

# İsmi, açıklaması, büyüsü olan özel eşyaları burada tanımlayın.
# Bu eşyaları aşağıdaki loot-tiers bölümünde 'special:ID' şeklinde kullanabilirsiniz.
special-items:
  beyazlatici-kartopu:
    material: SNOWBALL
    name: "&fBeyazlatıcı Kartopu"
    lore:
      - "&7Düşman takımın bloğuna isabet ederse"
      - "&7o bloğu beyaza boyar."
  hiz-mumu:
    material: LIME_CANDLE
    name: "&aTakım Hızlandırma Mumu"
    lore:
      - "&7Yere konulduğunda 30 saniyeliğine"
      - "&7tüm takım arkadaşlarına Hız II verir."
  kuvvet-mumu:
    material: RED_CANDLE
    name: "&cTakım Kuvvet Mumu"
    lore:
      - "&7Yere konulduğunda 15 saniyeliğine"
      - "&7tüm takım arkadaşlarına Kuvvet I verir."
  yenilenme-mumu:
    material: PINK_CANDLE
    name: "&dTakım Yenilenme Mumu"
    lore:
      - "&7Yere konulduğunda 10 saniyeliğine"
      - "&7tüm takım arkadaşlarına Yenilenme II verir."

