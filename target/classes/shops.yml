# İzleyici Destek Mağazası Ayarları

shop-items:
  # Her bir '-' bir eşyayı temsil eder.
  # id: Eşyanın benzersiz kimliği (sadece kod için, boşluksuz ve Türkçe karakter olmadan yazın).
  # material: Eşyanın Minecraft materyal adı.
  # quantity: Satın alındığında oyuncuya verilecek miktar.
  # price: Eşyanın puan cinsinden fiyatı.
  # display-name: Mağaza menüsünde görünecek ad.
  # lore: Mağaza menüsünde görünecek açıklama.
  # special-item-id: Eğer bu items.yml'deki özel bir eşya ise, onun ID'sini buraya yazın.

